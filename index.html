<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>냉장고 한 끼 | 맞춤형 레시피 생성기</title>
<style>
:root{--green:#006241;--accent:#00754a;--house:#1e3932;--cream:#f2f0eb;--ink:rgba(0,0,0,.87);--soft:rgba(0,0,0,.58);--line:#dfe4e1;--gold:#cba258;--radius:12px}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,sans-serif;letter-spacing:-.02em}button,input{font:inherit}button{cursor:pointer}button:active{transform:scale(.96)}.nav{height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100% - 1120px)/2));box-shadow:0 1px 3px #00000018}.brand{display:flex;align-items:center;gap:11px;color:var(--green);font-weight:800}.brand-mark{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:19px}.nav-note{font-size:13px;color:var(--soft)}.wrap{max-width:1120px;margin:auto;padding:58px 24px 80px}.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:72px;align-items:center;margin-bottom:56px}.eyebrow{color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.08em;margin-bottom:16px}.eyebrow span{display:inline-block;width:7px;height:7px;background:var(--gold);border-radius:50%;margin-right:7px}h1{font-size:clamp(42px,5.6vw,68px);line-height:1.07;letter-spacing:-.07em;margin:0 0 20px;color:var(--house)}h1 em{font-style:normal;color:var(--accent)}.hero-copy{font-size:16px;line-height:1.75;color:var(--soft);margin:0}.hero-stamp{width:188px;height:188px;border-radius:50%;background:var(--house);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-left:auto;box-shadow:0 0 0 10px #ffffff50,0 5px 10px #0000001c;transform:rotate(7deg)}.hero-stamp b{font-size:44px;line-height:1}.hero-stamp small{font-size:12px;color:#ffffffb3;margin-top:7px}.panel{background:#fff;border-radius:var(--radius);padding:27px;box-shadow:0 0 .5px #00000024,0 1px 1px #00000020}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.panel h2{font-size:20px;margin:0;color:var(--house)}.count{font-size:12px;color:var(--soft);background:#edf3ef;padding:7px 11px;border-radius:50px}.label{font-size:13px;font-weight:750;color:var(--soft);display:block;margin:0 0 11px}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.tag{border:1px solid #cdd6d1;background:#fff;color:var(--soft);border-radius:50px;padding:9px 13px;font-size:13px;transition:.2s}.tag.selected{background:#e4f1eb;border-color:var(--accent);color:var(--green);font-weight:750}.add-row{display:flex;gap:8px;margin-bottom:25px}.add-row input{min-width:0;flex:1;border:1px solid var(--line);border-radius:50px;padding:11px 15px;outline:none}.add-row input:focus{border-color:var(--accent)}.add-btn{border:1.5px solid var(--accent);background:#fff;color:var(--accent);border-radius:50px;padding:0 17px;font-weight:750}.seasoning{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:24px}.check{position:relative}.check input{position:absolute;opacity:0}.check span{display:block;text-align:center;border:1px solid var(--line);border-radius:8px;padding:11px 4px;font-size:12px;color:var(--soft);transition:.2s}.check input:checked+span{background:var(--house);border-color:var(--house);color:#fff}.generate{width:100%;border:0;border-radius:50px;background:var(--accent);color:#fff;padding:15px;font-weight:800;box-shadow:0 8px 12px #00754a29}.generate:disabled{opacity:.65;cursor:wait}.result-shell{background:var(--house);color:#fff;border-radius:var(--radius);padding:34px;min-height:290px}.result-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.result-kicker{font-size:12px;color:#ffffffb3;letter-spacing:.08em;font-weight:700}.result h2{font-size:31px;line-height:1.2;letter-spacing:-.05em;margin:9px 0 18px}.meta{display:flex;flex-wrap:wrap;gap:8px}.meta span{border:1px solid #ffffff59;padding:7px 11px;border-radius:50px;font-size:12px;color:#fff}.actions{display:flex;gap:8px}.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid #ffffff65;color:#fff;background:transparent;font-size:17px}.result-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;margin-top:30px}.result-grid h3{font-size:13px;color:#ffffffb3;margin:0 0 14px}.steps{display:grid;gap:10px}.step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;background:#ffffff0d;border-radius:9px;padding:12px}.step-num{width:25px;height:25px;border-radius:50%;background:#fff;color:var(--house);display:grid;place-items:center;font-size:12px;font-weight:800}.step p{margin:2px 0 0;font-size:14px;line-height:1.55}.ingredients{display:flex;flex-wrap:wrap;gap:7px}.ingredient{font-size:12px;color:#fff;background:#ffffff16;padding:7px 10px;border-radius:50px}.tip{margin-top:17px;background:#f7f1e4;color:#55452d;border-radius:9px;padding:13px 15px;font-size:13px;line-height:1.5}.tip b{display:block;color:#98742f;font-size:11px;margin-bottom:4px}.empty{display:grid;place-items:center;text-align:center;min-height:220px}.empty .emoji{font-size:43px;margin-bottom:12px}.empty p{margin:0;color:#ffffffb3;font-size:14px;line-height:1.6}.loading{display:flex;align-items:center;gap:13px;color:#fff}.spinner{width:24px;height:24px;border:3px solid #ffffff45;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.footer-note{text-align:center;color:#8b948f;font-size:12px;margin-top:25px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--house);color:#fff;padding:12px 18px;border-radius:50px;font-size:13px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:800px){.wrap{padding:38px 16px 60px}.nav{padding:0 16px;height:68px}.nav-note{display:none}.hero{display:block;margin-bottom:34px}.hero-stamp{display:none}.hero-copy{font-size:14px;margin-bottom:25px}h1{font-size:47px}.panel{padding:20px}.seasoning{grid-template-columns:repeat(3,1fr)}.result-shell{padding:22px}.result-grid{grid-template-columns:1fr;gap:24px}.result h2{font-size:26px}.actions{flex-shrink:0}}
</style></head>
<body><header class="nav"><div class="brand"><span class="brand-mark">🍳</span><span>냉장고 한 끼</span></div><span class="nav-note">자취생을 위한 15분 레시피</span></header><main class="wrap"><section class="hero"><div><div class="eyebrow"><span></span>AI RECIPE MAKER</div><h1>오늘은<br><em>뭘 해먹지?</em></h1><p class="hero-copy">냉장고 속 자투리 재료를 골라주세요.<br>설거지는 적게, 맛은 제대로인 한 끼를 찾아드릴게요.</p></div><div class="hero-stamp"><b>15</b><small>MINUTES<br>MAX</small></div></section>
<section class="panel"><div class="panel-head"><h2>지금 있는 재료</h2><span class="count" id="count">0개 선택</span></div><label class="label">주재료 <span style="font-weight:400">· 여러 개 선택 가능</span></label><div class="tags" id="ingredients"></div><div class="add-row"><input id="custom" placeholder="직접 입력해 추가하기" maxlength="20"><button class="add-btn" id="add">+ 추가</button></div><label class="label">보유 기본 양념</label><div class="seasoning" id="seasonings"></div><button class="generate" id="generate">✨ 내 냉장고로 레시피 생성하기</button></section><section class="result-shell" id="result" style="margin-top:18px"><div class="empty"><div><div class="emoji">🥣</div><p>재료를 고르고 버튼을 누르면<br>딱 맞는 레시피가 나타나요.</p></div></div></section><p class="footer-note">선택한 재료는 저장되지 않아요 · 혼자 먹기 좋은 1인분 기준</p></main><div class="toast" id="toast">레시피를 클립보드에 복사했어요.</div>
<script>
const mains=['계란','김치','스팸','참치캔','양파','대파','두부','라면사리','냉동만두','식빵','밥','감자','비엔나소시지','콩나물','우유'],sauces=['간장','고추장','고춧가루','설탕','참기름','다진마늘','굴소스','식용유','소금/후추','케첩'];let selected=[],selectedSauces=['식용유','소금/후추'];const $=s=>document.querySelector(s);
function render(){ $('#ingredients').innerHTML=mains.map(x=>`<button class="tag ${selected.includes(x)?'selected':''}" data-main="${x}">${x}</button>`).join('');$('#seasonings').innerHTML=sauces.map(x=>`<label class="check"><input type="checkbox" value="${x}" ${selectedSauces.includes(x)?'checked':''}><span>${x}</span></label>`).join('');$('#count').textContent=`${selected.length}개 선택`;document.querySelectorAll('[data-main]').forEach(b=>b.onclick=()=>{selected=selected.includes(b.dataset.main)?selected.filter(x=>x!==b.dataset.main):[...selected,b.dataset.main];render()});document.querySelectorAll('.check input').forEach(i=>i.onchange=()=>{selectedSauces=i.checked?[...selectedSauces,i.value]:selectedSauces.filter(x=>x!==i.value)})}$('#add').onclick=()=>{const v=$('#custom').value.trim();if(v&&!mains.includes(v)){mains.push(v);selected.push(v);$('#custom').value='';render()}};$('#custom').onkeydown=e=>{if(e.key==='Enter')$('#add').click()};
const fallback=()=>{const has=x=>selected.includes(x),base=selected.length?selected:['계란','밥'],pick=(arr)=>arr.find(x=>selected.includes(x)),main=base.slice(0,2).join('와 '),hasRice=has('밥'),hasNoodle=has('라면사리'),hasBread=has('식빵'),hasTofu=has('두부'),hasKimchi=has('김치'),hasEgg=has('계란'),kind=hasNoodle?'라면':hasBread?'토스트':hasTofu?'조림':hasRice?'볶음밥':hasEgg?'전/부침':'한 팬 볶음';let recipe;if(kind==='라면')recipe={name:`${pick(['김치','대파','계란'])||main} ${hasKimchi?'칼칼':''} 라면`,steps:[`1단계: 냄비에 물을 끓이고 ${hasKimchi?'김치와 대파를 먼저 넣어':'선택한 재료를 먼저 넣어'} 2분간 끓입니다.`,'2단계: 라면사리와 양념을 넣고 3분간 끓입니다.','3단계: 계란을 올리고 불을 끈 뒤 1분 뜸 들여 완성합니다.'],tool:'냄비 1개'};else if(kind==='토스트')recipe={name:`${hasEgg?'계란 ':' '} ${pick(['스팸','참치캔'])||''} 식빵 토스트`.trim(),steps:['1단계: 식빵 위에 선택한 재료를 올리고 양념을 얇게 바릅니다.','2단계: 팬에 식용유를 살짝 두르고 앞뒤로 2분씩 노릇하게 굽습니다.','3단계: 반으로 접어 한 손에 들고 바로 먹습니다.'],tool:'프라이팬 1개'};else if(kind==='조림')recipe={name:`${main} 달큰 간장조림`,steps:['1단계: 두부와 선택한 재료의 물기를 닦아 팬에 올립니다.','2단계: 간장, 설탕, 다진마늘과 물 3스푼을 넣고 5분 졸입니다.','3단계: 국물이 자작해지면 참기름을 둘러 마무리합니다.'],tool:'프라이팬 1개'};else if(kind==='볶음밥')recipe={name:`${hasKimchi?'김치 ':''}${pick(['참치캔','스팸','계란'])||main} 볶음밥`,steps:[`1단계: 팬에 기름을 두르고 ${hasKimchi?'김치와 ':' '}${pick(['참치캔','스팸','양파'])||main}을 3분 볶습니다.`,'2단계: 밥을 넣고 간장 또는 굴소스와 함께 센 불에 볶습니다.','3단계: 불을 끄고 참기름을 둘러 한 그릇에 담습니다.'],tool:'프라이팬 1개'};else if(kind==='전/부침')recipe={name:`${main} 바삭 계란전`,steps:[`1단계: ${main}을 한입 크기로 썰어 계란과 소금/후추에 섞습니다.`,'2단계: 달군 팬에 한 숟가락씩 올려 앞뒤로 2분씩 부칩니다.','3단계: 간장에 찍어 따뜻할 때 바로 즐깁니다.'],tool:'프라이팬 1개'};else recipe={name:`${main} 매콤 간장 볶음`,steps:[`1단계: 팬에 기름을 두르고 ${main}을 중불에서 3분 볶습니다.`,'2단계: 간장, 고춧가루, 설탕을 넣고 센 불에 2분 더 볶습니다.','3단계: 대파나 참기름을 올려 향을 더하고 접시에 담습니다.'],tool:'프라이팬 1개'};return{recipeName:'초간단 '+recipe.name,cookingTime:'10분',difficulty:'쉬움',dishwashingScore:`${recipe.tool} · 숟가락 1개`,ingredientsUsed:[...base,...selectedSauces].slice(0,6),substituteTip:selectedSauces.includes('참기름')?'참기름이 없다면 식용유를 조금 더 둘러도 괜찮아요.':'간장이 없다면 소금과 설탕을 아주 조금 넣어 간을 맞춰보세요.',steps:recipe.steps}};
function renderResult(r){$('#result').innerHTML=`<div class="result-top"><div><div class="result-kicker">YOUR TONIGHT'S RECIPE</div><h2>${r.recipeName}</h2><div class="meta"><span>⏱ ${r.cookingTime}</span><span>난이도 ${r.difficulty}</span><span>🫧 ${r.dishwashingScore}</span></div></div><div class="actions"><button class="icon-btn" id="copy">↗</button><button class="icon-btn" id="share">⌯</button></div></div><div class="result-grid"><div><h3>조리 순서</h3><div class="steps">${r.steps.map((s,i)=>`<div class="step"><span class="step-num">${i+1}</span><p>${s.replace(/^\d단계: /,'')}</p></div>`).join('')}</div></div><div><h3>사용한 재료</h3><div class="ingredients">${r.ingredientsUsed.map(x=>`<span class="ingredient">${x}</span>`).join('')}</div><div class="tip"><b>💡 대체 재료 팁</b>${r.substituteTip}</div></div></div>`;const text=`${r.recipeName}\n${r.cookingTime} · ${r.difficulty}\n\n${r.steps.join('\n')}\n\n대체 팁: ${r.substituteTip}`;$('#copy').onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(text).then(toast);else toast()};$('#share').onclick=()=>navigator.share?navigator.share({title:r.recipeName,text}):toast()}
function toast(){$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}$('#generate').onclick=async()=>{if(!selected.length){selected=['계란','밥'];render()}const btn=$('#generate');btn.disabled=true;btn.textContent='🥄 재료를 맛있게 조합하는 중...';$('#result').innerHTML='<div class="empty"><div class="loading"><span class="spinner"></span><span>릴스 넘기듯 빠르게 레시피를 만들고 있어요</span></div></div>';try{const res=await fetch('/api/recipe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ingredients:selected,seasonings:selectedSauces})});renderResult(res.ok?await res.json():fallback())}catch{setTimeout(()=>renderResult(fallback()),500)}finally{btn.disabled=false;btn.textContent='✨ 다시 레시피 생성하기'}};render();
</script></body></html>
